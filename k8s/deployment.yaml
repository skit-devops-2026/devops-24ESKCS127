apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-ecommerce-deployment
  labels:
    app: devops-ecommerce
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-ecommerce
  template:
    metadata:
      labels:
        app: devops-ecommerce
    spec:
      containers:
        - name: devops-ecommerce-app
          image: ghcr.io/skit-devops-2026/devops-24eskcs127:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
